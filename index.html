<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Электронные часы</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #2d3d70 0%, #141628 60%, #090a12 100%);
      color: #f5f7ff;
    }

    /* From Uiverse.io by Na3ar-17 */
    .clock-card {
      border: none;
      outline: none;
      background-color: #2c2c2c;
      width: min(90vw, 380px);
      padding: 2.75rem 2.5rem;
      color: #fff;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .clock-card::before {
      content: "";
      position: absolute;
      inset: -10px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: inherit;
      z-index: -1;
      filter: blur(16px);
      transition: all 0.3s ease;
    }

    .clock-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 25px 55px rgba(0, 0, 0, 0.6);
    }

    .clock-card:hover::before {
      filter: blur(10px);
    }

    .gradient-container {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      overflow: hidden;
      z-index: -2;
      filter: blur(12px);
      transition: all 0.3s ease;
    }

    .gradient {
      position: absolute;
      inset: -20%;
      border-radius: inherit;
      background-image: linear-gradient(
        120deg,
        hsla(226, 81%, 64%, 0.95),
        hsla(271, 81%, 64%, 0.9),
        hsla(316, 81%, 64%, 0.85),
        hsla(1, 81%, 64%, 0.9),
        hsla(46, 81%, 64%, 0.88),
        hsla(91, 81%, 64%, 0.9),
        hsla(136, 81%, 64%, 0.88),
        hsla(181, 81%, 64%, 0.9)
      );
      background-size: 220% 220%;
      animation: gradient-move 12s ease-in-out infinite alternate;
      filter: blur(26px);
    }

    .clock-card:hover .gradient-container {
      filter: blur(18px);
    }

    .clock-surface {
      width: 100%;
      border-radius: 12px;
      background-color: rgba(36, 36, 36, 0.8);
      background-image: linear-gradient(
        180deg,
        rgba(36, 36, 36, 0.9) 0%,
        rgba(55, 55, 55, 0.85) 100%
      );
      padding: 1.5rem 1.25rem;
      text-align: center;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.45), 0 0 20px rgba(255, 255, 255, 0.08);
    }

    .time {
      margin: 0;
      font-size: clamp(3rem, 9vw, 5rem);
      letter-spacing: 0.12em;
      font-weight: 600;
      text-shadow: 0 0 14px rgba(110, 173, 255, 0.6);
    }

    .date {
      margin-top: 1rem;
      font-size: clamp(1rem, 3vw, 1.4rem);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      font-weight: 400;
      color: rgba(224, 228, 255, 0.9);
      text-shadow: 0 0 10px rgba(255, 188, 255, 0.4);
    }

    @keyframes gradient-move {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
  </style>
</head>
<body>
  <div class="clock-card">
    <div class="gradient-container">
      <div class="gradient"></div>
    </div>
    <div class="clock-surface">
      <p class="time" id="time">00:00:00</p>
      <p class="date" id="date">01 января 1970</p>
    </div>
  </div>

  <script>
    const timeElement = document.getElementById('time');
    const dateElement = document.getElementById('date');

    const monthNames = [
      'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
      'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'
    ];

    const weekdayNames = [
      'воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'
    ];

    function pad(value) {
      return value.toString().padStart(2, '0');
    }

    function updateClock() {
      const now = new Date();
      const hours = pad(now.getHours());
      const minutes = pad(now.getMinutes());
      const seconds = pad(now.getSeconds());

      timeElement.textContent = `${hours}:${minutes}:${seconds}`;

      const day = now.getDate();
      const month = monthNames[now.getMonth()];
      const year = now.getFullYear();
      const weekday = weekdayNames[now.getDay()];

      dateElement.textContent = `${weekday}, ${pad(day)} ${month} ${year}`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
