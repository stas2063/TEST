<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Электронные часы</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #f9f9fc 0%, #d8dbe8 55%, #c2c7d6 100%);
      color: #f5f7ff;
    }

    /* From Uiverse.io by Na3ar-17 */
    .clock-card {
      border: none;
      outline: none;
      background-color: #2c2c2c;
      width: min(90vw, 380px);
      padding: 2.75rem 2.5rem;
      color: #fff;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: 0 24px 55px rgba(28, 34, 56, 0.35);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
      overflow: hidden;
    }

    .clock-card::before {
      content: "";
      position: absolute;
      inset: -18px;
      border-radius: calc(18px + 18px);
      background: linear-gradient(
        120deg,
        rgba(86, 124, 255, 0.95),
        rgba(166, 107, 255, 0.95),
        rgba(255, 122, 183, 0.95),
        rgba(255, 138, 115, 0.95),
        rgba(255, 207, 120, 0.95),
        rgba(139, 236, 148, 0.95),
        rgba(86, 124, 255, 0.95)
      );
      background-size: 280% 280%;
      filter: blur(28px);
      z-index: -2;
      animation: glow-flow 8s ease-in-out infinite;
    }

    .clock-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(43, 43, 43, 0.92);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.45);
      z-index: -1;
    }

    .clock-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 28px 70px rgba(28, 34, 56, 0.4);
    }

    .clock-surface {
      width: 100%;
      border-radius: 14px;
      background: linear-gradient(165deg, rgba(40, 40, 40, 0.95), rgba(70, 70, 70, 0.85));
      padding: 1.75rem 1.4rem;
      text-align: center;
      box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.55), 0 0 18px rgba(255, 255, 255, 0.06);
    }

    .time {
      margin: 0;
      font-size: clamp(3rem, 9vw, 5rem);
      letter-spacing: 0.16em;
      font-weight: 600;
      text-shadow: 0 0 16px rgba(118, 178, 255, 0.65);
    }

    .date {
      margin-top: 1.1rem;
      font-size: clamp(1rem, 3vw, 1.35rem);
      letter-spacing: 0.26em;
      text-transform: uppercase;
      font-weight: 400;
      color: rgba(226, 230, 255, 0.92);
      text-shadow: 0 0 12px rgba(255, 203, 255, 0.42);
    }

    @keyframes glow-flow {
      0% {
        background-position: 0% 50%;
        transform: rotate(0deg);
      }
      50% {
        background-position: 100% 50%;
        transform: rotate(180deg);
      }
      100% {
        background-position: 0% 50%;
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="clock-card">
    <div class="clock-surface">
      <p class="time" id="time">00:00:00</p>
      <p class="date" id="date">01 января 1970</p>
    </div>
  </div>

  <script>
    const timeElement = document.getElementById('time');
    const dateElement = document.getElementById('date');

    const monthNames = [
      'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
      'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'
    ];

    const weekdayNames = [
      'воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'
    ];

    function pad(value) {
      return value.toString().padStart(2, '0');
    }

    function updateClock() {
      const now = new Date();
      const hours = pad(now.getHours());
      const minutes = pad(now.getMinutes());
      const seconds = pad(now.getSeconds());

      timeElement.textContent = `${hours}:${minutes}:${seconds}`;

      const day = now.getDate();
      const month = monthNames[now.getMonth()];
      const year = now.getFullYear();
      const weekday = weekdayNames[now.getDay()];

      dateElement.textContent = `${weekday}, ${pad(day)} ${month} ${year}`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
