<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Электронные часы</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #f9f9fc 0%, #d8dbe8 55%, #c2c7d6 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* From Uiverse.io by Na3ar-17 */
    .clock-button {
      border: none;
      outline: none;
      background-color: #3a3a3a;
      width: min(92vw, 420px);
      height: clamp(220px, 45vw, 260px);
      color: #fff;
      border-radius: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: default;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 24px 50px rgba(31, 38, 135, 0.35);
    }

    .clock-button::before {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: inherit;
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 10px 40px rgba(31, 38, 135, 0.37);
      z-index: -1;
      transition: all 0.3s ease;
    }

    .gradient-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 108%;
      height: 118%;
      overflow: hidden;
      border-radius: inherit;
      z-index: -2;
      filter: blur(12px);
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .gradient {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 160%;
      height: 160%;
      border-radius: 42%;
      background-image: linear-gradient(
        90deg,
        hsl(226, 81%, 64%),
        hsl(271, 81%, 64%),
        hsl(316, 81%, 64%),
        hsl(1, 81%, 64%),
        hsl(46, 81%, 64%),
        hsl(91, 81%, 64%),
        hsl(136, 81%, 64%),
        hsl(181, 81%, 64%)
      );
      animation: rotate 3.5s linear infinite;
      filter: blur(12px);
    }

    .clock-label {
      width: calc(100% - 48px);
      height: calc(100% - 44px);
      border-radius: 18px;
      background-color: rgba(43, 43, 43, 0.96);
      background-image: linear-gradient(180deg, rgba(43, 43, 43, 1) 0%, rgba(68, 68, 68, 1) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 18px;
      box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.48);
      padding: 24px 28px;
    }

    .time {
      margin: 0;
      font-size: clamp(3.2rem, 12vw, 5.5rem);
      letter-spacing: 0.12em;
      font-weight: 600;
      text-shadow: 0 0 18px rgba(118, 178, 255, 0.7);
    }

    .date {
      margin: 0;
      font-size: clamp(1rem, 3.2vw, 1.35rem);
      letter-spacing: 0.26em;
      text-transform: uppercase;
      font-weight: 400;
      color: rgba(226, 230, 255, 0.9);
      text-shadow: 0 0 12px rgba(255, 203, 255, 0.45);
    }

    .clock-button:hover {
      transform: translateY(-8px);
      box-shadow: 0 32px 68px rgba(31, 38, 135, 0.42);
    }

    .clock-button:hover .gradient-container {
      transform: translate(-50%, -50%) scale(0.98);
      filter: blur(7px);
    }

    .clock-button:hover .gradient {
      filter: blur(7px);
    }

    @keyframes rotate {
      0% {
        transform: translate(-50%, -50%) rotate(0deg);
      }
      100% {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="clock-button" role="presentation">
    <span class="clock-label">
      <span class="time" id="time">00:00:00</span>
      <span class="date" id="date">01 января 1970</span>
    </span>
    <span class="gradient-container" aria-hidden="true">
      <span class="gradient"></span>
    </span>
  </div>

  <script>
    const timeElement = document.getElementById('time');
    const dateElement = document.getElementById('date');

    const monthNames = [
      'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
      'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'
    ];

    const weekdayNames = [
      'воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'
    ];

    const pad = (value) => value.toString().padStart(2, '0');

    function updateClock() {
      const now = new Date();
      const hours = pad(now.getHours());
      const minutes = pad(now.getMinutes());
      const seconds = pad(now.getSeconds());

      timeElement.textContent = `${hours}:${minutes}:${seconds}`;

      const day = pad(now.getDate());
      const month = monthNames[now.getMonth()];
      const year = now.getFullYear();
      const weekday = weekdayNames[now.getDay()];

      dateElement.textContent = `${weekday}, ${day} ${month} ${year}`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
